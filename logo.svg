<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="نور الشام">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff5a1f"/>
      <stop offset="1" stop-color="#ffb800"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff6d6"/>
      <stop offset=".55" stop-color="#ffb800"/>
      <stop offset="1" stop-color="#ff5a1f"/>
    </radialGradient>
  </defs>
  <!-- badge -->
  <rect width="64" height="64" rx="18" fill="url(#bg)"/>
  <!-- Damascene 8-point star -->
  <g fill="#fff">
    <rect x="17" y="17" width="30" height="30" rx="2.5"/>
    <rect x="17" y="17" width="30" height="30" rx="2.5" transform="rotate(45 32 32)"/>
  </g>
  <!-- inner ring + glowing core (نور) -->
  <circle cx="32" cy="32" r="10.5" fill="none" stroke="#ff7a1f" stroke-width="2.2"/>
  <circle cx="32" cy="32" r="6.5" fill="url(#core)"/>
</svg>
